name: Remove inaccurate demo caption

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-caption:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove caption
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='          <p class=\"demo-caption\">\n            A real look at Justus in action: planning, adapting, and staying\n            with you <em>one message at a time</em>.\n          </p>\n'; assert old in s, 'caption not found'; p.write_text(s.replace(old, '', 1), encoding='utf-8')"

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-demo-caption.yml
          git commit -m "Remove inaccurate app demo caption"
          git push origin main
