name: Patch homepage demo video

on:
  push:
    branches:
      - add-app-demo-video

permissions:
  contents: write

jobs:
  patch-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-app-demo-video

      - name: Replace static demo with video
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css_anchor = "      .demo-phone-screen {\n"
          video_css = (
              "      .demo-video {\n"
              "        display: block;\n"
              "        width: 100%;\n"
              "        height: 100%;\n"
              "        object-fit: cover;\n"
              "        border-radius: 38px;\n"
              "        background: #000;\n"
              "      }\n"
              "      .demo-phone-screen {\n"
          )
          if css_anchor not in html:
              raise SystemExit('Could not find demo phone CSS anchor')
          html = html.replace(css_anchor, video_css, 1)

          responsive_anchor = (
              "        .demo-phone-screen {\n"
              "          border-radius: 30px;\n"
              "          padding: 44px 12px 12px;\n"
              "        }\n"
          )
          responsive_replacement = (
              responsive_anchor
              + "        .demo-video {\n"
              + "          border-radius: 30px;\n"
              + "        }\n"
          )
          if responsive_anchor not in html:
              raise SystemExit('Could not find responsive demo CSS anchor')
          html = html.replace(responsive_anchor, responsive_replacement, 1)

          start_marker = '          <div class="demo-phone" aria-label="App preview">'
          end_marker = '          <p class="demo-caption">'
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not find static demo markup')

          video_markup = (
              "          <div class=\"demo-phone\">\n"
              "            <video\n"
              "              class=\"demo-video\"\n"
              "              controls\n"
              "              playsinline\n"
              "              preload=\"metadata\"\n"
              "              aria-label=\"Justus app demo video\"\n"
              "            >\n"
              "              <source\n"
              "                src=\"/media/Youtube%20version%20of%20app%20video.mp4\"\n"
              "                type=\"video/mp4\"\n"
              "              />\n"
              "              Your browser does not support embedded video.\n"
              "            </video>\n"
              "          </div>\n"
          )
          html = html[:start] + video_markup + html[end:]

          old_caption = (
              "          <p class=\"demo-caption\">\n"
              "            The Home screen from the current build: today's session, the\n"
              "            week ahead, and the coach <em>one message away</em>.\n"
              "          </p>\n"
          )
          new_caption = (
              "          <p class=\"demo-caption\">\n"
              "            A real look at Justus in action: planning, adapting, and staying\n"
              "            with you <em>one message at a time</em>.\n"
              "          </p>\n"
          )
          if old_caption not in html:
              raise SystemExit('Could not find demo caption')
          html = html.replace(old_caption, new_caption, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit homepage update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-demo-video.yml
          git commit -m "Replace homepage app mockup with demo video"
          git push origin add-app-demo-video
