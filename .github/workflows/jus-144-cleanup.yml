name: Clean JUS-144 pricing copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: gideon/jus-144-aiso-event-athlete-icp-edits-marathon-guide-founding-athlete
          fetch-depth: 0

      - name: Clean and validate pricing copy
        run: python scripts/cleanup-jus-144-pricing.py

      - name: Verify beta is untouched
        run: git diff --exit-code origin/main -- beta/index.html

      - name: Smoke-test key pages
        run: |
          python -m http.server 8000 >/tmp/justus-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'Training for something'
          curl --fail --silent http://127.0.0.1:8000/guides/marathon-training-app/ | grep -q 'best marathon training app'
          curl --fail --silent http://127.0.0.1:8000/founding-athletes/ | grep -q 'Founding Athlete'

      - name: Remove one-time cleanup machinery
        run: |
          rm scripts/cleanup-jus-144-pricing.py
          rm .github/workflows/jus-144-cleanup.yml

      - name: Commit cleaned copy
        run: |
          git config user.name 'Justus site automation'
          git config user.email 'hello@justus.health'
          git add -A
          git commit -m 'JUS-144: clean pricing language and validate pages'
          git push origin HEAD:gideon/jus-144-aiso-event-athlete-icp-edits-marathon-guide-founding-athlete
